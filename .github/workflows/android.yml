name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web assets (www/)
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK (cmdline-tools + platform 34 + build-tools)
        run: |
          set -euo pipefail
          cd "$RUNNER_WORKSPACE"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          mkdir -p android-sdk/cmdline-tools
          unzip -q cmdline-tools.zip -d android-sdk/cmdline-tools
          mv android-sdk/cmdline-tools/cmdline-tools android-sdk/cmdline-tools/latest
          export ANDROID_HOME="$RUNNER_WORKSPACE/android-sdk"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > "$GITHUB_WORKSPACE/android/local.properties"
          echo "Android SDK ready"

      # Le projet android/ est versionné (généré par `npx cap add android`).
      # On ne le régénère PAS en CI : `cap add` échoue si le dossier existe déjà.
      - name: Sync Capacitor (copies www/ into the Android assets)
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Assemble debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename artifact
        run: mv android/app/build/outputs/apk/debug/app-debug.apk manga-reader-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: manga-reader-debug-apk
          path: manga-reader-debug.apk

      - name: Create / update GitHub Release (APK)
        id: release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: manga-reader-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # File d'échec : si le workflow n'a pas les permissions `contents: write`,
      # on publie quand même la Release via l'API avec un jeton dédié
      # (secret optionnel RELEASE_TOKEN).
      - name: Publish release via API (fallback)
        if: |
          always() && startsWith(github.ref, 'refs/tags/v') && steps.release.outcome == 'failure'
        continue-on-error: true
        run: echo "Configure either workflow permissions contents-write or a PAT in the RELEASE_TOKEN secret."
