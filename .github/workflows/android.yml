name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web assets (www/)
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Le projet android/ est versionné (généré par `npx cap add android`).
      # On ne le régénère PAS en CI : `cap add` échoue si le dossier existe déjà.
      - name: Sync Capacitor (copies www/ into the Android assets)
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Assemble debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename artifact
        run: mv android/app/build/outputs/apk/debug/app-debug.apk manga-reader-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: manga-reader-debug-apk
          path: manga-reader-debug.apk

      - name: Create / update GitHub Release (APK)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: manga-reader-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
